<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Tablas de Multiplicar</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet"/>

  <!-- Estilos propios -->
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <!--HEADER-->
  <header class="app-header container-fluid px-3">
    <span class="header-deco">✖️</span>
    <h1>Tablas de Multiplicar</h1>
    <p>Genera tablas de multiplicar al instante</p>
  </header>

  <!-- CONTROLS -->
  <div class="container px-3">
    <div class="control-card">

      <!-- Tabla Inicial -->
      <div class="mb-3">
        <label for="tablaInicio">Tabla inicial</label>
        <input type="number" id="tablaInicio" min="1" max="100" value="3" placeholder="Ej: 3"/>
      </div>

      <!-- Tabla Final -->
      <div class="mb-3">
        <label for="tablaFin">Tabla final</label>
        <input type="number" id="tablaFin" min="1" max="100" value="5" placeholder="Ej: 5"/>
      </div>

      <!-- Hasta -->
      <div class="mb-4">
        <label for="hasta">Multiplicar hasta</label>
        <input type="number" id="hasta" min="1" max="20" value="10" placeholder="Ej: 10"/>
      </div>

      <!-- Error -->
      <p id="errorMsg" class="error-msg"></p>

      <!-- Botón -->
      <button class="btn-generate" onclick="generarTablas()">
        ➕ Generar Tablas
      </button>
    </div>
  </div>

  <!-- RESULTS -->
  <section id="results-section" class="container-fluid px-2">
    <div class="results-header">
      <h2 id="resultsTitle">Tablas generadas</h2>
      <p id="resultsSubtitle"></p>
    </div>
    <div class="tables-grid" id="tablesGrid"></div>
  </section>

  <!-- FOOTER -->
  <footer class="app-footer">
    Tablas de Multiplicar &copy; 2026 — Hecho con HTML, CSS, Bootstrap &amp; JavaScript
  </footer>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Script propio -->
  <script src="script.js"></script>

</body>
</html>
